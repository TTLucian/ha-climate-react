[project]
name = "ha-climate-react"
version = "0.0.0"
description = "Home Assistant custom integration: Sensibo-style Climate React automation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pytest>=9.0.0",
    "pytest-homeassistant-custom-component",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
# NOTE: target-version is pinned to "py313" (not "py314") as a workaround for a
# Ruff formatter bug (ruff 0.16.x) that rewrites `except (A, B):` into the
# invalid Python 2 form `except A, B:` when targeting py314, producing a
# SyntaxError on Python 3.14. See https://github.com/astral-sh/ruff/issues/25923
# Revert to "py314" once a Ruff release fixes this. py313-targeted code is
# valid on Python 3.14, so this is safe.
target-version = "py313"
exclude = [".venv", "__pycache__", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = [
    "E501",  # Line too long
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["misc"]  # Prevents HA class attribute assignment errors (_attr_options)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
[project]
name = "ha-climate-react"
version = "0.0.0"
description = "Home Assistant custom integration: Sensibo-style Climate React automation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "homeassistant",
    "pytest",
    "pytest-homeassistant-custom-component",
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [".venv", "__pycache__", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "UP"]  # Enable PyUpgrade rules explicitly if desired
ignore = [
    "E501",  # line too long
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
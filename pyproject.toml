[project]
name = "ha-climate-react"
version = "0.2.14"
description = "Home Assistant custom integration: Sensibo-style Climate React automation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "homeassistant",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "black>=25.0.0",
    "mypy>=2.3.0",
]

[tool.ruff]
line-length = 120
exclude = [".venv", "__pycache__", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
ignore = [
    "E501",  # line too long (entity IDs)
]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true

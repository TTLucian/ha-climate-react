name: Release Drafter

on:
  push:
    branches:
      - main

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from manifest.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' custom_components/climate_react/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version found: $VERSION"

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Never touch an already-published release
          EXISTING_PUBLISHED=$(gh release list --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"v${VERSION}\" and .isDraft == false) | .tagName")
          if [ -n "$EXISTING_PUBLISHED" ]; then
            echo "Published release v${VERSION} already exists. Skipping."
            exit 0
          fi

          # Skip if a draft already exists
          EXISTING_DRAFT=$(gh release list --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"v${VERSION}\" and .isDraft == true) | .tagName")
          if [ -n "$EXISTING_DRAFT" ]; then
            echo "Draft release v${VERSION} already exists. Nothing to do."
            exit 0
          fi

          echo "Creating draft release v${VERSION}"
          gh release create "v${VERSION}" \
            --draft \
            --title "v${VERSION}" \
            --notes ""
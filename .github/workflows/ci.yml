name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-json:
    name: Validate JSON and Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON Files
        run: |
          python3 - <<'PY'
          import json, sys

          files = [
              'custom_components/climate_react/manifest.json',
              'custom_components/climate_react/strings.json',
              'custom_components/climate_react/translations/en.json'
          ]

          failed = False
          for file_path in files:
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      json.load(f)
                  print(f"OK: {file_path}")
              except Exception as e:
                  print(f"FAILED: {file_path} - {e}", file=sys.stderr)
                  failed = True

          if failed:
              sys.exit(1)
          PY

  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      # uvx dynamically fetches and runs ruff in an isolated sandbox
      - name: Run Ruff Linter
        run: uvx ruff check .

      - name: Check Formatting with Ruff
        run: uvx ruff format --check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Run mypy
        run: uvx mypy custom_components/climate_react

  tests:
    name: Run tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies & run pytest
        run: |
          if [ -d tests ]; then
            uv sync --group dev
            uv run pytest -q
          else
            echo "No tests directory found; skipping pytest"
          fi